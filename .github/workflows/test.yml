name: test
on:
  workflow_call:
    inputs:
      haxe:
        required: true
        type: string
      arch:
        required: true
        type: string
      sep:
        required: true
        type: string
      ext:
        required: true
        type: string
      os:
        required: true
        type: string

env:
  HXCPP_ARCH_FLAG: ${{ inputs.arch == 'Arm64' && 'HXCPP_ARM64' || format('HXCPP_M{0}', inputs.arch) }}

jobs:
  haxe:
    runs-on: ${{ inputs.os }}
    name: haxe
    defaults:
      run:
        working-directory: test/haxe
    steps:
      - name: checkout
        uses: actions/checkout@v4
      #- name: setup
      #  uses: ./.github/workflows/setup
      #  with:
      #    haxe: ${{ inputs.haxe }}
      - name: build
        run: |
          #haxe -C ../../tools/cc -m Main --cpp bin -D destination=g++
          #haxe -C ../../tools/hxcpp compile-cpp.hxml
          ulimit -n
          ulimit -n 256
          ulimit -n
          #haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }} -D HXCPP_COMPILE_THREADS=1
          #haxelib run hxcpp Build.xml -D${{ env.HXCPP_ARCH_FLAG }} -DHXCPP_COMPILE_THREADS=1 -DHXCPP_VERBOSE
          echo Without pch
          clang++ -c -H test.cpp -otest.o
          echo Compiling pch
          clang++ -c -H -o test.pch ./test.hpp
          echo With pch
          clang++ -c -H -include-pch test.pch test.cpp -otest.o
      - name: run
        run: bin${{ inputs.sep }}TestMain

